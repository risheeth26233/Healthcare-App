{% extends "base.html" %}

{% block title %}Create Account - HealthCare App{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">
                <span class="logo-icon">⚕</span>
                <span class="logo-text">HealthCare</span>
            </div>
            <h1>Create Your Account</h1>
            <p class="auth-subtitle">Sign up with your name and get your own Patient ID and Secret Code</p>
        </div>

        <form method="POST" class="auth-form" novalidate>
            <div class="form-group">
                <label for="full_name">Full Name <span class="required">*</span></label>
                <input type="text" id="full_name" name="full_name" required 
                       value="{{ form_data.full_name or '' }}" 
                       placeholder="John Doe"
                       autocomplete="name"
                       aria-describedby="full-name-hint">
                <span id="full-name-hint" class="form-hint">No email or password needed</span>
            </div>

            <button type="submit" class="btn btn-primary btn-large btn-block">Create Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
        </div>
    </div>
</div>
{% endblock %}
